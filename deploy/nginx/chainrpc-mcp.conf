server {
    listen 127.0.0.1:3080 default_server;
    server_name chainrpc-mcp.mitander.io;

    set_real_ip_from 127.0.0.1;
    set_real_ip_from ::1;
    real_ip_header CF-Connecting-IP;
    real_ip_recursive on;

    client_max_body_size 1m;
    limit_req zone=mcp_per_ip burst=30 nodelay;
    limit_conn mcp_connections 20;

    if ($http_cf_visitor ~* '"scheme":"http"') {
        return 308 https://chainrpc-mcp.mitander.io$request_uri;
    }

    add_header Cache-Control "no-store" always;
    add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;

    location / {
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Host chainrpc-mcp.mitander.io;
        proxy_set_header Connection "";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        send_timeout 3600s;
        gzip off;
    }
}
